<title>拉鋸：情境二次函數</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Chiron+Hei+HK:wght@400;500;700;900&family=Martian+Mono:wght@400;500;600&family=Crimson+Pro:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: 一張固定比例的 riso 套印海報（1600×900，直式 900×1560），左側深墨色任務欄，右側兩張「紙」：長方形與圖形，底部是 x 的尺。
   Color: 紙、墨、螢光粉（量 A）、藍（量 B）、兩色疊印出的紫（乘積 y）。 */
:root{
  --paper:#F2F1F6; --paper-2:#E6E4EE; --ink:#1C1B24; --ink-2:#565468; --ink-3:#9896AB;
  --pink:#FF3E9B; --blue:#0077C0; --violet:#5A2D8C; --yellow:#FFE23A; --green:#00A35A; --warn:#E8452C;
  --side:#1C1B24; --side-fg:#F2F1F6; --side-fg-2:#A9A7BD; --side-line:#3A3848; --lbl:#FFFFFF;
  --blend:multiply; --band:.26; --ovr:.6;
  --f-cn:"Chiron Hei HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-num:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-mono:"Martian Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"Crimson Pro","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16151C; --paper-2:#1F1E28; --ink:#EEEDF6; --ink-2:#B4B2C6; --ink-3:#6E6C82;
  --pink:#FF5BB0; --blue:#3AA2F2; --violet:#CDA6FF; --yellow:#FFE23A; --green:#2FCB80; --warn:#FF6A55;
  --side:#0D0C12; --side-fg:#EEEDF6; --side-fg-2:#9C9AB0; --side-line:#2C2A38; --lbl:#16151C;
  --blend:screen; --band:.30; --ovr:.78; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#16151C; --paper-2:#1F1E28; --ink:#EEEDF6; --ink-2:#B4B2C6; --ink-3:#6E6C82;
  --pink:#FF5BB0; --blue:#3AA2F2; --violet:#CDA6FF; --yellow:#FFE23A; --green:#2FCB80; --warn:#FF6A55;
  --side:#0D0C12; --side-fg:#EEEDF6; --side-fg-2:#9C9AB0; --side-line:#2C2A38; --lbl:#16151C;
  --blend:screen; --band:.30; --ovr:.78; color-scheme:dark }

html,body{height:100%}
body{background:var(--side);color:var(--ink);font-family:var(--f-cn);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--side)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);
  display:grid;overflow:hidden;
  grid-template-columns:430px 1fr 1fr;grid-template-rows:76px 1fr 138px;
  grid-template-areas:"head head head" "side scene graph" "side ruler ruler"}
#stage.portrait{grid-template-columns:1fr 1fr;grid-template-rows:118px 470px 1fr 150px;
  grid-template-areas:"head head" "side side" "scene graph" "ruler ruler"}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:var(--blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .55  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ---------- head ---------- */
header{grid-area:head;display:flex;align-items:center;gap:28px;padding:0 26px 0 0;background:var(--paper);border-bottom:3px solid var(--ink);position:relative;z-index:2;flex-wrap:wrap}
.mark{width:430px;height:100%;display:flex;align-items:center;gap:14px;padding:0 26px;background:var(--side);color:var(--side-fg);flex:none}
#stage.portrait .mark{width:auto;height:62px;background:none;color:var(--ink);padding:0 0 0 26px}
.mark b{font-family:var(--f-cn);font-weight:900;font-size:38px;letter-spacing:.06em;position:relative;color:var(--pink);line-height:1}
.mark b{white-space:nowrap}.mark b::after{content:"拉鋸";position:absolute;left:3px;top:2px;white-space:nowrap;color:var(--blue);mix-blend-mode:screen;opacity:.9}
#stage.portrait .mark b::after{mix-blend-mode:var(--blend)}
.mark small{display:flex;flex-direction:column;font-size:13px;line-height:1.35;color:var(--side-fg-2);letter-spacing:.04em}
#stage.portrait .mark small{color:var(--ink-2)}
.mark small em{font-style:normal;color:var(--side-fg);font-weight:700;font-size:15px}
#stage.portrait .mark small em{color:var(--ink)}
nav.stations{display:flex;gap:2px;height:100%;align-items:stretch}
#stage.portrait header{display:grid;grid-template-columns:auto 1fr;grid-template-rows:64px 1fr;padding:0;gap:0}
#stage.portrait .head-r{grid-column:2;grid-row:1;padding-right:22px}
#stage.portrait nav.stations{grid-column:1/3;grid-row:2;height:100%;padding-left:12px;border-top:1.5px solid var(--paper-2)}
.st{background:none;border:0;display:flex;align-items:center;gap:9px;padding:0 14px;position:relative;color:var(--ink-2);font-weight:500;font-size:16px}
.st .n{font-family:var(--f-num);font-weight:800;font-size:24px;color:var(--ink-3);letter-spacing:.02em}
.st .ck{width:9px;height:9px;border:1.5px solid var(--ink-3);transform:rotate(45deg)}
.st.done .ck{background:var(--green);border-color:var(--green)}
.st:hover{color:var(--ink)}
.st.on{color:var(--ink);font-weight:700}
.st.on .n{color:var(--pink)}
.st.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-3px;height:6px;background:var(--pink)}
.head-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.skins{display:flex;border:2px solid var(--ink)}
.skin{background:none;border:0;padding:7px 14px;font-size:15px;font-weight:700;display:flex;gap:7px;align-items:center}
.skin + .skin{border-left:2px solid var(--ink)}
.skin svg{width:18px;height:18px}
.skin.on{background:var(--ink);color:var(--paper)}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.icon-btn{background:none;border:2px solid var(--ink);width:38px;height:38px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* ---------- side ---------- */
aside{overflow:hidden;grid-area:side;background:var(--side);color:var(--side-fg);padding:18px 26px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;position:relative;z-index:1}
#stage.portrait aside{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;row-gap:14px;align-content:start;
  grid-template-areas:"h i" "t i" "t k";grid-template-rows:auto auto 1fr}
#stage.portrait .sthead{grid-area:h}#stage.portrait .info{grid-area:i}#stage.portrait .task{grid-area:t}#stage.portrait .take{grid-area:k;align-self:start}
.sthead{display:flex;align-items:flex-end;gap:14px}
.bignum{font-family:var(--f-num);font-weight:900;font-size:92px;line-height:.78;color:var(--pink);position:relative;letter-spacing:-.01em;flex:none}
.bignum::after{content:attr(data-n);position:absolute;left:4px;top:3px;color:var(--blue);mix-blend-mode:screen;opacity:.85}
.sthead h2{margin:0;font-size:26px;white-space:nowrap;font-weight:900;line-height:1.22;text-wrap:balance;letter-spacing:.02em}
.sthead .lab{color:var(--side-fg-2);display:block;margin-bottom:6px}
.info{border:1.5px solid var(--side-line);padding:12px 14px 12px;font-size:15.5px;line-height:1.75;color:var(--side-fg)}
.info .lab{color:var(--side-fg-2);display:flex;justify-content:space-between;margin-bottom:4px}
.story span[data-tag]{cursor:help;padding:1px 0;border-bottom:3px solid}
.story span[data-tag="x"]{border-color:var(--yellow)}
.story span[data-tag="A"]{border-color:var(--pink)}
.story span[data-tag="B"]{border-color:var(--blue)}
.facts{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14.5px;align-items:baseline}
.facts .k{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 6px;color:#fff;text-align:center}
.k.x{background:var(--yellow);color:#1C1B24}.k.A{background:var(--pink)}.k.B{background:var(--blue)}.k.y{background:var(--violet);color:var(--paper)}
.facts .v{color:var(--side-fg)}
.facts .v i, .m{font-family:var(--f-math);font-style:italic;font-size:1.12em}
.facts .v small{color:var(--side-fg-2);font-size:12.5px;margin-left:6px}
.hl-A .facts .k.A,.hl-B .facts .k.B,.hl-x .facts .k.x{outline:2px solid var(--side-fg);outline-offset:2px}
.task{display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.6;flex:1;min-height:0;overflow:auto}
.task p{margin:0;color:var(--side-fg)}
.task .sub{color:var(--side-fg-2);font-size:14px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.step .no{font-family:var(--f-num);font-weight:800;font-size:22px;line-height:1.1;color:var(--side-fg-2)}
.step.cur .no{color:var(--yellow)}
.step.ok .no{color:var(--green)}
.step.wait{opacity:.38}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{background:var(--side-fg);color:var(--side);border:0;padding:7px 14px;font-weight:700;font-size:14.5px}
.btn.ghost{background:none;color:var(--side-fg);border:1.5px solid var(--side-fg-2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sel{background:var(--yellow);color:#1C1B24}
.btn.right{background:var(--green);color:#fff}
.btn.wrong{background:var(--warn);color:#fff}
.stepper{display:flex;align-items:center;border:1.5px solid var(--side-fg-2)}
.stepper button{background:none;border:0;width:34px;height:34px;font-size:20px;color:var(--side-fg)}
.stepper output{min-width:76px;text-align:center;font-family:var(--f-num);font-weight:800;font-size:26px;color:var(--yellow)}
.ineq{font-family:var(--f-math);font-style:italic;font-size:19px;line-height:1.5;padding:6px 0 4px 14px;border-left:4px solid var(--yellow)}
.ineq b{font-style:normal;font-family:var(--f-cn);font-weight:700;font-size:14px;color:var(--side-fg-2);margin-right:8px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding:4px 9px;border:1.5px dashed var(--side-fg-2);color:var(--side-fg-2)}
.chip.got{border-style:solid;border-color:var(--green);color:var(--side-fg)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.fb{font-size:14.5px;padding:7px 10px;background:var(--side-line)}
.fb.good{border-left:4px solid var(--green)}
.fb.bad{border-left:4px solid var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid var(--side-line);text-align:right}
.tbl th{color:var(--side-fg-2);font-weight:500;font-size:12.5px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.best td{color:var(--green);font-weight:700}
.tbl tr.no td{color:var(--side-fg-2);text-decoration:line-through}
.take{margin-top:auto;background:var(--yellow);color:#1C1B24;padding:12px 14px 13px;font-size:16px;line-height:1.6;font-weight:700;position:relative}
.take .lab{color:#1C1B24;opacity:.6;display:block;margin-bottom:3px}
.take.locked{background:none;border:1.5px dashed var(--side-line);color:var(--side-fg-2);font-weight:500;font-size:14.5px}
.take.locked .lab{color:var(--side-fg-2)}
#stage.portrait .take{margin-top:0}
.qs{display:flex;flex-direction:column;gap:3px}
.q{background:none;border:0;border-top:1.5px solid var(--side-line);text-align:left;padding:5px 0 2px;display:grid;grid-template-columns:30px 1fr;gap:8px;color:var(--side-fg)}
.q .no{font-family:var(--f-num);font-weight:800;font-size:22px;color:var(--side-fg-2);line-height:1.1}
.q .t{font-weight:700;font-size:15.5px}
.q .a{display:block;font-weight:400;font-size:13.5px;color:var(--side-fg-2);margin-top:1px;line-height:1.5}
.q.on .no{color:var(--yellow)}
.q.on .a{color:var(--side-fg)}

/* ---------- panels ---------- */
.panel{position:relative;min-width:0;min-height:0}
#scene{grid-area:scene;border-right:3px solid var(--ink)}
#graph{grid-area:graph}
.panel > svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ptitle{position:absolute;left:22px;top:16px;display:flex;gap:10px;align-items:baseline;z-index:1;pointer-events:none}
.ptitle b{font-size:17px;font-weight:900;letter-spacing:.04em}
#graph svg{cursor:crosshair}
#graph.folding svg{cursor:ew-resize}

/* ---------- ruler ---------- */
#ruler{grid-area:ruler;border-top:3px solid var(--ink);display:grid;grid-template-columns:200px 1fr;background:var(--paper-2)}
.xread{border-right:3px solid var(--ink);padding:14px 20px;display:flex;flex-direction:column;justify-content:center;background:var(--yellow);color:#1C1B24}
.xread .lab{color:#1C1B24;opacity:.65}
.xread .val{font-family:var(--f-num);font-weight:900;font-size:66px;line-height:.9;letter-spacing:-.01em}
.xread .val small{font-family:var(--f-cn);font-size:18px;font-weight:700;margin-left:6px}
.xread .xdef{font-size:12.5px;line-height:1.35;margin-top:4px}
.rmain{display:flex;flex-direction:column;min-width:0}
.eq{display:flex;align-items:center;gap:14px;padding:12px 24px 0;font-variant-numeric:tabular-nums;flex-wrap:nowrap;white-space:nowrap}
.eq .t{display:flex;align-items:baseline;gap:8px}
.eq .t .k{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 6px;color:#fff;align-self:center}
.eq .t .nm{font-size:14px;color:var(--ink-2)}
.eq .t .num{font-family:var(--f-num);font-weight:800;font-size:36px;line-height:1}
.eq .t .u{font-size:14px;color:var(--ink-2)}
.eq .op{font-family:var(--f-num);font-size:30px;color:var(--ink-3)}
.eq .A .num{color:var(--pink)}.eq .B .num{color:var(--blue)}.eq .Y .num{color:var(--violet)}
.eq .units{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);border:1.5px solid var(--ink-3);padding:4px 8px}
.eq .neg{color:var(--warn)!important}
#track{flex:1;position:relative;min-height:0}
#track svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}

/* svg text */
svg text{font-family:var(--f-cn);fill:var(--ink)}
.tk{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}
.tk2{font-family:var(--f-mono);font-size:12px;fill:var(--ink-2)}
.ovr{mix-blend-mode:var(--blend)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.drop{animation:drop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box}
@media (prefers-reduced-motion: reduce){.pulse,.drop{animation:none}}
</style>

<div id="viewport">
<div id="stage">
  <header>
    <div class="mark"><b>拉鋸</b><small><em>情境二次函數</em>最大值藏在哪裡</small></div>
    <nav class="stations" id="nav" aria-label="五個站"></nav>
    <div class="head-r">
      <span class="lab">情境</span>
      <div class="skins" id="skins" role="radiogroup" aria-label="情境"></div>
      <button class="icon-btn" id="fs" title="全螢幕" aria-label="全螢幕"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg></button>
    </div>
  </header>
  <aside id="side"></aside>
  <section class="panel" id="scene"><div class="ptitle"><b id="sceneTitle">長方形</b><span class="lab" id="sceneSub">A × B</span></div><svg id="sceneSvg"></svg></section>
  <section class="panel" id="graph"><div class="ptitle"><b>y 怎麼跟著 x 變</b><span class="lab" id="graphSub">trail</span></div><svg id="graphSvg" tabindex="0" aria-label="函數圖形"></svg></section>
  <section id="ruler">
    <div class="xread"><span class="lab">拖動 x</span><div class="val" id="xval">2<small>m</small></div><div class="xdef" id="xdef"></div></div>
    <div class="rmain">
      <div class="eq" id="eq"></div>
      <div id="track"><svg id="trackSvg" tabindex="0" role="slider" aria-label="x 的值"></svg></div>
    </div>
  </section>
</div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;
function fmt(v){ v=r2(v); if(Object.is(v,-0)) v=0; const s=Number.isInteger(v)?String(v):v.toFixed(Math.abs(v)<10?2:1).replace(/0+$/,'').replace(/\.$/,''); return s.replace('-','−'); }

/* ================= 情境 ================= */
const SKINS={
 fence:{
  name:'圍籬', icon:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v14M3 5h13v10H3"/></svg>',
  story:[['用 ',0],['24 m 的籬笆','B'],['靠著一面牆圍出長方形菜圃，',0],['靠牆那一邊不用籬笆','B'],['。設',0],['與牆垂直的邊長為 x 公尺','x'],['，菜圃面積為 y 平方公尺。',0]],
  xdef:'與牆垂直的邊長', xu:'m',
  A:{nm:'寬',ex:'x',u:'m',f:x=>x, sub:x=>`寬 = ${fmt(x)}`},
  B:{nm:'長',ex:'24 − 2x',u:'m',f:x=>24-2*x, how:'24 − x − x', sub:x=>`長 = 24 − 2×${fmt(x)} = ${fmt(24-2*x)}`},
  Y:{nm:'面積',u:'m²'}, units:'m × m = m²',
  z:[0,12], zl:['0','12'], m:6, ml:'6', yl:'72',
  midStr:'(0 + 12) ÷ 2 = 6', yStr:'6 × (24 − 12) = 6 × 12 = 72',
  ineq:[['寬 > 0','x > 0'],['長 > 0','24 − 2x > 0 ⇒ x < 12'],['範圍','0 < x < 12']],
  range:[-1,13], step:.5, x0:2, yAx:[-30,84], yT:10, xT:1, xL:2, same:true,
  outL:'寬是負的：圍不出來', outR:'長是負的：籬笆不夠用',
  guessNote:g=>Math.abs(g-8)<.01?'猜 x = 8（正方形）的人最多。靠著牆圍，最大的並不是正方形。':'',
  cons:[{id:'wall',label:'牆只有 10 m 長',lines:['長 ≤ 10','24 − 2x ≤ 10 ⇒ x ≥ 7'],iv:[7,12],step:.5,note:'可用範圍 7 ≤ x < 12。正中間 x = 6 站不進去。',cands:[6,7,8]}]
 },
 drink:{
  name:'飲料', icon:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h10l-1.4 11H6.4zM4 6h12M11 6l2-4"/></svg>',
  story:[['一杯手搖飲',0],['成本 20 元','A'],['。',0],['定價 40 元時，每天賣 130 杯','B'],['；',0],['定價每多 1 元，就少賣 3 杯','B'],['。設',0],['定價為 x 元','x'],['，每天利潤為 y 元。',0]],
  xdef:'每杯定價', xu:'元',
  A:{nm:'每杯賺',ex:'x − 20',u:'元/杯',f:x=>x-20, how:'定價 − 成本', sub:x=>`每杯賺 = ${fmt(x)} − 20 = ${fmt(x-20)}`},
  B:{nm:'杯數',ex:'250 − 3x',u:'杯',f:x=>250-3*x, how:'130 − 3(x − 40)', sub:x=>`杯數 = 250 − 3×${fmt(x)} = ${fmt(250-3*x)}`},
  Y:{nm:'利潤',u:'元'}, units:'元/杯 × 杯 = 元',
  z:[20,250/3], zl:['20','250/3 ≈ 83.3'], m:155/3, ml:'155/3 ≈ 51.7', yl:'≈ 3008.3',
  midStr:'(20 + 250/3) ÷ 2 = 155/3 ≈ 51.7', yStr:'(155/3 − 20)(250 − 155) = 95/3 × 95 ≈ 3008.3',

function allowed(x,c){ const e=1e-9, sk=SK(); return x>=c.iv[0]-e && x<=c.iv[1]+e && Math.abs(x/c.step-Math.round(x/c.step))<1e-9 && sk.A.f(x)>0 && sk.B.f(x)>0; }
function bestCand(c){ let b=null; for(const x of c.cands) if(allowed(x,c)&&(b===null||SK().y(x)>SK().y(b))) b=x; return b; }

$('#side').addEventListener('click',e=>{

  if(a==='ci'){ p.ci=+v; p.pick=null; }

  if(a==='q'){ p.q.add(v); S.focus=v; if(p.q.size>=5) p.done[4]=1; }

function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; if(parent) parent.appendChild(e); return e;}
function size(svg){const r=svg.parentElement; return [r.clientWidth, r.clientHeight];}
function niceTicks(a,b,step){const out=[]; for(let v=Math.ceil(a/step)*step; v<=b+1e-9; v+=step) out.push(r2(v)); return out;}

/* ================= 長方形（左） ================= */
function renderScene(){
  const svg=$('#sceneSvg'); svg.innerHTML='';
  const [W,H]=size(svg); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const sk=SK(), p=P(), x=p.x, A=sk.A.f(x), B=sk.B.f(x), Y=A*B;
  $('#sceneTitle').textContent=sk.name==='圍籬'?'菜圃':'看不見的長方形';
  $('#sceneSub').textContent=`${sk.A.nm} × ${sk.B.nm} = ${sk.Y.nm}`;
  const L=96,R=30,T=70,Bm=86; const iw=W-L-R, ih=H-T-Bm;
  let maxA=0,maxB=0; for(let t=sk.range[0];t<=sk.range[1];t+=sk.step){maxA=Math.max(maxA,sk.A.f(t)); maxB=Math.max(maxB,sk.B.f(t));}
  let sx=iw/maxA, sy=ih/maxB; if(sk.same){const s=Math.min(sx,sy); sx=sy=s;}
  const O=[L,T+ih];
  const g=el('g',{},svg);
  const defs=el('defs',{},svg);
  const pat=el('pattern',{id:'hatch',width:7,height:7,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs); el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'var(--ink)','stroke-width':2.2},pat);
  const pat2=el('pattern',{id:'hatchW',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs); el('line',{x1:0,y1:0,x2:0,y2:6,stroke:'var(--warn)','stroke-width':2},pat2);
  const fA=S.focus==='ab'?' pulse':'';
  // 軸
  el('line',{x1:O[0],y1:O[1],x2:O[0]+iw+8,y2:O[1],stroke:'var(--ink)','stroke-width':1.5},g);
  el('line',{x1:O[0],y1:O[1],x2:O[0],y2:T-14,stroke:'var(--ink)','stroke-width':1.5},g);
  el('text',{x:O[0]+iw+8,y:O[1]+20,'text-anchor':'end',class:'tk2'},g,`${sk.A.nm}（${sk.A.u}）→`);
  el('text',{x:O[0]-10,y:T-22,'text-anchor':'end',class:'tk2'},g,`↑ ${sk.B.nm}（${sk.B.u}）`);
  const a=Math.max(0,A), b=Math.max(0,B);
  const ovr=el('g',{style:'isolation:isolate'},g);
  // 兩條半透明的色帶交疊成長方形
  if(A>0) el('rect',{x:O[0],y:T-14,width:a*sx,height:ih+14,fill:'var(--pink)',opacity:'var(--band)',class:'ovr'+fA},ovr);
  if(B>0) el('rect',{x:O[0],y:O[1]-b*sy,width:iw+8,height:b*sy,fill:'var(--blue)',opacity:'var(--band)',class:'ovr'+fA},ovr);

drag($('#trackSvg'),([px])=>{ setX(TR.x0+(px-TR.L)/TR.iw*(TR.x1-TR.x0)); });
drag($('#graphSvg'),([px])=>{ const v=G.x0+(px-G.L)/G.iw*(G.x1-G.x0); if(S.st===2) setFold(v); else setX(v); });
function keys(e){ const sk=SK(),p=P(); let d=0; if(e.key==='ArrowRight'||e.key==='ArrowUp') d=1; if(e.key==='ArrowLeft'||e.key==='ArrowDown') d=-1; if(!d) return; e.preventDefault(); const big=e.shiftKey?5:1;
  if(S.st===2&&e.currentTarget.id==='graphSvg') setFold(p.fold+d*sk.step*big); else setX(p.x+d*sk.step*big); }
$('#trackSvg').addEventListener('keydown',keys); $('#graphSvg').addEventListener('keydown',keys);

/* ================= render ================= */
let raf=0;
function renderAll(fast){
  if(fast){ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{renderSideIfNeeded(); renderScene(); renderGraph(); renderRuler(); renderNav();}); return; }
  renderNav(); renderSide(); lastSideKey=sideKey(); renderScene(); renderGraph(); renderRuler();
}
let lastSideKey='';
function sideKey(){const p=P(); return [S.st,S.skin,p.trail.size,p.zA,p.zB,p.folded,p.fold,S.st===2?p.x:'',p.locked,p.obs,p.pick,p.ci,[...p.q].join()].join('|');}
function renderSideIfNeeded(){const k=sideKey(); if(k!==lastSideKey){renderSide(); lastSideKey=k;}}

fit();
document.fonts&&document.fonts.ready.then(()=>renderAll());
})();
</script>
